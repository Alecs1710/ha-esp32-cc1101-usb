send_raw:
  name: Send RAW Code (ESP32 CC1101)
  description: Transmits a microsecond pulse sequence over the USB port to the CC1101 transceiver.
  fields:
    code:
      name: RAW Sequence
      description: Comma-separated microsecond duration values.
      required: true
      example: "250,750,250,750,750,250"
      selector:
        text:
